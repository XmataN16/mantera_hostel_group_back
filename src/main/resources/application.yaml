spring:
  application:
    name: mantera-hostel-group-back

  datasource:
    url: jdbc:postgresql://localhost:5432/mantera_hostel
    username: mantera_user
    password: 1111
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080